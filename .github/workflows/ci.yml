name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest tests -q
      - name: Doctor (log/privacy consistency on tracked sample)
        run: python scripts/thesis_review.py doctor
